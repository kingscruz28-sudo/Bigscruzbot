name: Tests

on:
  push:
    branches: [main]
  pull_request:
  # Lets a run be started by hand. Without this, a pull_request event that
  # never queues leaves no way to get a result short of closing and
  # reopening the PR.
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -v
